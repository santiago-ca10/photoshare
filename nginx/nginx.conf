events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Balanceo round-robin entre las dos réplicas del servicio de fotos.
    # Si una cae, Nginx marca el fallo y envía el tráfico a la otra.
    upstream auth_svc   { server auth:8000; }
    upstream photos_svc { server photos1:8000 max_fails=1 fail_timeout=10s;
                          server photos2:8000 max_fails=1 fail_timeout=10s; }
    upstream social_svc { server social:8000; }
    upstream notif_svc  { server notifications:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 8m;

        # Interfaz de usuario (estáticos)
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # Fotos subidas (volumen compartido, solo lectura)
        location /uploads/ {
            alias /data/uploads/;
            expires 7d;
        }

        # API REST
        location /api/auth/   { proxy_pass http://auth_svc; }
        location /api/photos  { proxy_pass http://photos_svc;
                                proxy_next_upstream error timeout http_502 http_503; }
        location /api/social/ { proxy_pass http://social_svc; }

        # WebSocket
        location /ws {
            proxy_pass http://notif_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
